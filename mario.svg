<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%">
<defs>
<style>
  /* === MARIO: combined X+Y walk+jump === */
  @keyframes mario-move {
    0%    { transform: translate(-80px,  0px); }
    34%   { transform: translate(270px,  0px); }
    37%   { transform: translate(302px, -48px); }
    40%   { transform: translate(334px,  0px); }
    100%  { transform: translate(975px,  0px); }
  }
  /* Walking frames (legs alternating) */
  @keyframes leg-a { 0%,49.9%{opacity:1}50%,100%{opacity:0} }
  @keyframes leg-b { 0%,49.9%{opacity:0}50%,100%{opacity:1} }

  /* === GOOMBA walk + squish on impact === */
  @keyframes goomba-x {
    from { transform: translateX(890px); }
    to   { transform: translateX(-60px); }
  }
  /* === COIN spin (scaleX trick) === */
  @keyframes coin-spin {
    0%,100%{ transform: scaleX(1) translateY(0); }
    25%    { transform: scaleX(0.1) translateY(-2px); }
    50%    { transform: scaleX(1) translateY(-4px); }
    75%    { transform: scaleX(0.1) translateY(-2px); }
  }
  /* Coin collected: fly up and vanish */
  @keyframes coin-collect {
    0%,33%       { opacity:1; transform:scaleX(1) translateY(0); }
    36%,40%      { opacity:0; transform:scaleX(1) translateY(-30px); }
    41%,100%     { opacity:1; transform:scaleX(1) translateY(0); }
  }
  /* === ? BLOCK bounce on hit === */
  @keyframes q-hit {
    0%,33%,44%,100% { transform: translateY(0); }
    37%             { transform: translateY(-8px); }
    40%             { transform: translateY(0); }
  }
  /* === SCORE POPUP +100 === */
  @keyframes score-pop {
    0%,33%   { opacity:0; transform:translateY(0); }
    36%      { opacity:1; transform:translateY(-4px); }
    42%      { opacity:1; transform:translateY(-24px); }
    46%,100% { opacity:0; transform:translateY(-30px); }
  }
  /* === STAR particles on coin collect === */
  @keyframes star-burst-1 {
    0%,34%{ opacity:0;transform:translate(0,0) }
    37%   { opacity:1;transform:translate(-12px,-10px) }
    42%   { opacity:0;transform:translate(-20px,-18px) }
    43%,100%{ opacity:0 }
  }
  @keyframes star-burst-2 {
    0%,34%{ opacity:0;transform:translate(0,0) }
    37%   { opacity:1;transform:translate(12px,-10px) }
    42%   { opacity:0;transform:translate(20px,-18px) }
    43%,100%{ opacity:0 }
  }
  @keyframes star-burst-3 {
    0%,34%{ opacity:0;transform:translate(0,0) }
    37%   { opacity:1;transform:translate(0,-16px) }
    42%   { opacity:0;transform:translate(0,-26px) }
    43%,100%{ opacity:0 }
  }
  /* === CLOUDS drift === */
  @keyframes drift1 { 0%,100%{transform:translateX(0)} 50%{transform:translateX(18px)} }
  @keyframes drift2 { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-14px)} }
  /* === STAR spin === */
  @keyframes star-spin { from{transform:rotate(0deg)}to{transform:rotate(360deg)} }
  /* === SCREEN FLASH on hit === */
  @keyframes hit-flash {
    0%,35%,42%,100%{ opacity:0 }
    37%,40%        { opacity:0.18 }
  }
  /* === PARALLAX BG hills drift === */
  @keyframes hill-drift { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-20px)} }

  .mario     { animation: mario-move 8s linear infinite; }
  .leg-a     { animation: leg-a 0.22s linear infinite; }
  .leg-b     { animation: leg-b 0.22s linear infinite; }
  .goomba    { animation: goomba-x 10s linear infinite; }
  .coin      { animation: coin-collect 8s linear infinite; transform-origin: 355px 90px; }
  .q-block   { animation: q-hit 8s linear infinite; }
  .score-pop { animation: score-pop 8s linear infinite; }
  .sb1       { animation: star-burst-1 8s linear infinite; transform-origin: 355px 88px; }
  .sb2       { animation: star-burst-2 8s linear infinite; transform-origin: 355px 88px; }
  .sb3       { animation: star-burst-3 8s linear infinite; transform-origin: 355px 88px; }
  .cloud1    { animation: drift1 7s ease-in-out infinite; }
  .cloud2    { animation: drift2 9s ease-in-out infinite; }
  .bg-star   { animation: star-spin 4s linear infinite; }
  .hit-flash { animation: hit-flash 8s linear infinite; }
  .hills     { animation: hill-drift 12s ease-in-out infinite; }
</style>
</defs>

<!-- ── SKY GRADIENT ── -->
<defs>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#3E6DC8"/>
    <stop offset="100%" stop-color="#6FAEE8"/>
  </linearGradient>
</defs>
<rect width="900" height="200" fill="url(#skyGrad)"/>

