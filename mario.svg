  <line x1="780" y1="163" x2="780" y2="185"/>
  <line x1="840" y1="163" x2="840" y2="185"/>
  <line x1="30"  y1="172" x2="60"  y2="172"/>
  <line x1="90"  y1="172" x2="120" y2="172"/>
  <line x1="150" y1="172" x2="180" y2="172"/>
  <line x1="210" y1="172" x2="240" y2="172"/>
  <line x1="270" y1="172" x2="300" y2="172"/>
  <line x1="330" y1="172" x2="360" y2="172"/>
  <line x1="390" y1="172" x2="420" y2="172"/>
  <line x1="450" y1="172" x2="480" y2="172"/>
  <line x1="510" y1="172" x2="540" y2="172"/>
  <line x1="570" y1="172" x2="600" y2="172"/>
  <line x1="630" y1="172" x2="660" y2="172"/>
  <line x1="690" y1="172" x2="720" y2="172"/>
  <line x1="750" y1="172" x2="780" y2="172"/>
  <line x1="810" y1="172" x2="840" y2="172"/>
</g>

<!-- ── GOOMBA (enemy walking opposite direction) ── -->
<g class="goomba">
  <!-- Body -->
  <ellipse cx="0" cy="143" rx="14" ry="12" fill="#8B4513"/>
  <!-- Head -->
  <ellipse cx="0" cy="132" rx="15" ry="13" fill="#C87028"/>
  <!-- Eyes -->
  <ellipse cx="-5" cy="130" rx="5" ry="5" fill="white"/>
  <ellipse cx="5"  cy="130" rx="5" ry="5" fill="white"/>
  <circle  cx="-4" cy="130" r="3"         fill="black"/>
  <circle  cx="6"  cy="130" r="3"         fill="black"/>
  <!-- Eyebrows (angry) -->
  <line x1="-9" y1="126" x2="-2" y2="128" stroke="#5B2900" stroke-width="2"/>
  <line x1="2"  y1="128" x2="9"  y2="126" stroke="#5B2900" stroke-width="2"/>
  <!-- Feet -->
  <ellipse cx="-8" cy="153" rx="9" ry="5" fill="#5B2900"/>
  <ellipse cx="8"  cy="153" rx="9" ry="5" fill="#5B2900"/>
</g>

<!-- ── MARIO ── -->
<!-- Ground y=150, Mario height=48px, so top at y=102 -->
<g class="mario">
  <!-- Hat crown (red) -->
  <rect x="6"  y="102" width="27" height="6"  fill="#CC0000"/>
  <!-- Hat brim (red, wider) -->
  <rect x="3"  y="108" width="33" height="3"  fill="#CC0000"/>
  <!-- Face (skin tone) -->
  <rect x="6"  y="111" width="27" height="12" fill="#FFB894"/>
  <!-- Eye white -->
  <rect x="18" y="114" width="9"  height="6"  fill="white"/>
  <!-- Pupil -->
  <rect x="21" y="114" width="4"  height="4"  fill="#1A1A8C"/>
  <rect x="22" y="115" width="2"  height="2"  fill="black"/>
  <!-- Nose bump -->
  <rect x="24" y="120" width="6"  height="3"  fill="#FFAA77"/>
  <!-- Mustache -->
  <rect x="9"  y="120" width="24" height="3"  fill="#8B4513"/>
  <!-- Red shirt (body) -->
  <rect x="3"  y="123" width="33" height="15" fill="#CC0000"/>
  <!-- Overalls bib (blue) -->
  <rect x="9"  y="123" width="21" height="15" fill="#0000CC"/>
  <!-- Overall straps detail -->
  <rect x="10" y="124" width="5"  height="8"  fill="#0000AA"/>
  <rect x="24" y="124" width="5"  height="8"  fill="#0000AA"/>
  <!-- Buttons -->
  <rect x="13" y="129" width="3"  height="3"  fill="white"/>
  <rect x="23" y="129" width="3"  height="3"  fill="white"/>
  <!-- Left arm (red sleeve) -->
  <rect x="0"  y="126" width="6"  height="9"  fill="#CC0000"/>
  <!-- Right arm (red sleeve) -->
  <rect x="33" y="126" width="6"  height="9"  fill="#CC0000"/>
  <!-- Gloves (white) -->
  <rect x="0"  y="135" width="6"  height="3"  fill="white"/>
  <rect x="33" y="135" width="6"  height="3"  fill="white"/>
  <!-- Legs (blue overalls) -->
  <rect x="6"  y="138" width="10" height="9"  fill="#0000CC"/>
  <rect x="23" y="138" width="10" height="9"  fill="#0000CC"/>
  <!-- Boots (brown) -->
  <rect x="3"  y="144" width="13" height="6"  fill="#5B2900"/>
  <rect x="23" y="144" width="15" height="6"  fill="#5B2900"/>
  <!-- Boot highlight -->
  <rect x="4"  y="145" width="4"  height="2"  fill="#7A3900" opacity="0.5"/>
  <rect x="24" y="145" width="4"  height="2"  fill="#7A3900" opacity="0.5"/>
</g>

</svg>
